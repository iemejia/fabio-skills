name: Sync with fabio releases

on:
  repository_dispatch:
    types: [fabio-released]
  workflow_dispatch:
    inputs:
      tag:
        description: "fabio release tag to sync from (e.g. v0.9.1)"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-fabio:
    runs-on: ubuntu-latest
    steps:
      - name: Determine release tag
        id: release-info
        env:
          DISPATCH_TAG: ${{ github.event.client_payload.tag }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${DISPATCH_TAG:-$INPUT_TAG}"
          if [ -z "$TAG" ]; then
            # Fallback: fetch latest release tag from GitHub API
            TAG=$(curl -s https://api.github.com/repos/iemejia/fabio/releases/latest | grep '"tag_name"' | cut -d'"' -f4)
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Syncing from fabio release: $TAG"

      - name: Checkout fabio-skills
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Checkout fabio at release tag
        uses: actions/checkout@v6
        with:
          repository: iemejia/fabio
          path: fabio-upstream
          ref: ${{ steps.release-info.outputs.tag }}
          fetch-depth: 0

      - name: Gather release context
        id: context
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release-info.outputs.tag }}
        run: |
          # Fetch release notes from GitHub API
          RELEASE_NOTES=$(curl -s "https://api.github.com/repos/iemejia/fabio/releases/tags/$TAG" | jq -r '.body // "No release notes available."')
          echo "$RELEASE_NOTES" > /tmp/fabio-release-notes.md
          echo "Release notes saved for tag: $TAG"

          # Get diff between this tag and the previous tag
          cd fabio-upstream
          PREV_TAG=$(git tag --sort=-version:refname | grep '^v' | awk -v cur="$TAG" '$0 != cur {print; exit}')
          if [ -n "$PREV_TAG" ]; then
            echo "Comparing $PREV_TAG...$TAG"
            git diff "$PREV_TAG".."$TAG" > /tmp/fabio-changes.diff
            git log "$PREV_TAG".."$TAG" --stat > /tmp/fabio-changes-summary.txt
            git log "$PREV_TAG".."$TAG" --oneline > /tmp/fabio-commits.txt
          else
            echo "No previous tag found, using full history"
            git log --oneline -50 > /tmp/fabio-commits.txt
            git diff HEAD~50 > /tmp/fabio-changes.diff || true
            git log --stat -50 > /tmp/fabio-changes-summary.txt
          fi

          # Save AGENTS.md for full context
          cp AGENTS.md /tmp/fabio-agents.md

      - name: Set up Node.js
        uses: actions/setup-node@v4

      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      - name: Build Copilot prompt
        env:
          TAG: ${{ steps.release-info.outputs.tag }}
        run: |
          # Assemble prompt from template + context files into a single file
          # This avoids shell expansion issues with $ characters in AGENTS.md
          {
            cat .github/prompts/sync-fabio-skill.md
            echo ""
            echo "## Release Tag"
            echo ""
            echo "$TAG"
            echo ""
            echo "## Release Notes"
            echo ""
            cat /tmp/fabio-release-notes.md
            echo ""
            echo "## Changes Since Previous Release"
            echo ""
            cat /tmp/fabio-changes-summary.txt
            echo ""
            echo "## Commit Log"
            echo ""
            cat /tmp/fabio-commits.txt
            echo ""
            echo "## fabio AGENTS.md (Full Context)"
            echo ""
            cat /tmp/fabio-agents.md
            echo ""
            echo "The full diff is available at /tmp/fabio-changes.diff and the full fabio repo is at ./fabio-upstream/."
          } > /tmp/copilot-prompt.md

      - name: Update skill with Copilot
        env:
          GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
        run: |
          # Use stdin to pass prompt — avoids shell expansion of $WS, $LH etc. in the content
          copilot \
            --allow-tool='shell(git:*)' \
            --allow-tool='shell(cat:*)' \
            --allow-tool='shell(ls:*)' \
            --allow-tool='shell(find:*)' \
            --allow-tool='shell(head:*)' \
            --allow-tool='shell(tail:*)' \
            --allow-tool='shell(grep:*)' \
            --allow-tool='shell(wc:*)' \
            --allow-tool=read \
            --allow-tool=write \
            --allow-tool=edit \
            --no-ask-user < /tmp/copilot-prompt.md

      - name: Check for skill changes
        id: skill-changes
        run: |
          git add -A
          git reset -- fabio-upstream
          if git diff --cached --quiet; then
            echo "No skill changes were made"
            echo "has_skill_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "Skill changes detected:"
            git diff --cached --stat
            echo "has_skill_changes=true" >> "$GITHUB_OUTPUT"
          fi
          # Unstage for the PR step to handle cleanly
          git reset HEAD

      - name: Validate skill structure
        if: steps.skill-changes.outputs.has_skill_changes == 'true'
        run: |
          # Basic validation: SKILL.md exists and has frontmatter
          if ! head -1 fabio/SKILL.md | grep -q "^---"; then
            echo "ERROR: SKILL.md missing frontmatter"
            exit 1
          fi
          # Check SKILL.md is under 500 lines
          LINES=$(wc -l < fabio/SKILL.md)
          if [ "$LINES" -gt 500 ]; then
            echo "ERROR: SKILL.md exceeds 500 lines ($LINES lines)"
            exit 1
          fi
          echo "Skill validation passed ($LINES lines)"

      - name: Create pull request
        if: steps.skill-changes.outputs.has_skill_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.COPILOT_PAT }}
          TAG: ${{ steps.release-info.outputs.tag }}
        run: |
          BRANCH="sync/fabio-$TAG"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          git reset -- fabio-upstream
          git commit -m "feat: sync skill with fabio $TAG"
          git push origin "$BRANCH"

          PR_BODY="/tmp/pr-body.md"
          if [ ! -f "$PR_BODY" ]; then
            echo "Automated sync with iemejia/fabio release $TAG." > "$PR_BODY"
          fi

          # Ensure labels exist
          gh label create "automated" --color "0e8a16" --description "Automated PRs" 2>/dev/null || true
          gh label create "fabio-sync" --color "1d76db" --description "Synced from fabio upstream" 2>/dev/null || true

          gh pr create \
            --title "feat: sync skill with fabio $TAG" \
            --body-file "$PR_BODY" \
            --label "automated,fabio-sync"
